<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a1a" />
    </marker>
  </defs>

  <!-- Outer boundary -->
  <rect x="16" y="12" width="488" height="556" fill="none" stroke="#404040" stroke-width="2" stroke-dasharray="10 6" rx="4" />

  <!-- User -->
  <g transform="translate(210, 28)">
    <circle cx="50" cy="18" r="12" fill="#d9d9d9" stroke="#404040" />
    <path d="M50 34 L50 48 M36 42 L64 42 M50 48 L40 64 M50 48 L60 64" stroke="#404040" stroke-width="2" fill="none" />
    <text x="50" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#000">User</text>
  </g>

  <!-- Interact with -->
  <line x1="260" y1="112" x2="260" y2="146" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrowHead)" />
  <text x="318" y="134" font-size="10" fill="#404040">Interact with</text>

  <!-- Portal screen -->
  <rect x="72" y="148" width="376" height="400" fill="#ffffff" stroke="#404040" stroke-width="2" rx="2" />

  <!-- SharePoint project dropdown -->
  <rect x="96" y="172" width="328" height="40" fill="#ffffff" stroke="#404040" stroke-width="1.5" rx="2" />
  <text x="112" y="197" font-size="11" fill="#000">SharePoint project</text>
  <polygon points="404,188 414,188 409,198" fill="#404040" />

  <!-- Upload issues -->
  <rect x="96" y="228" width="156" height="44" fill="#ffffff" stroke="#404040" stroke-width="1.5" rx="2" />
  <text x="174" y="255" text-anchor="middle" font-size="11" fill="#000">Upload issues</text>

  <!-- Audit -->
  <rect x="268" y="228" width="156" height="44" fill="#ffffff" stroke="#404040" stroke-width="1.5" rx="2" />
  <text x="346" y="255" text-anchor="middle" font-size="11" font-weight="600" fill="#000">Audit</text>

  <!-- Output panel -->
  <rect x="96" y="292" width="328" height="232" fill="#ffffff" stroke="#404040" stroke-width="1.5" rx="12" />
  <text x="260" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#000">Output</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#404040">Issue Log (DOCX)</text>
  <text x="260" y="392" text-anchor="middle" font-size="10" fill="#606060">Generated after audit completes</text>

  <!-- DOCX file chip -->
  <rect x="118" y="418" width="284" height="52" fill="#f5f5f5" stroke="#404040" stroke-width="1" rx="4" />
  <text x="260" y="442" text-anchor="middle" font-size="10.5" fill="#000">Project_Issue Log v0.N.docx</text>
  <text x="260" y="460" text-anchor="middle" font-size="9.5" fill="#404040">Download</text>
</svg>
